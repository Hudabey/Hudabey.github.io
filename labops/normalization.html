<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Normalization — LabOps</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body data-page="4">
  <div class="progress"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark"></span>
        <span class="brand-text">LabOps <small>a relational DBMS for GPU research ops</small></span>
      </a>
      <nav class="dots"></nav>
      <div class="counter"></div>
    </header>

    <main>
      <section class="page page-wide flex-page">
        <div class="reveal">
          <span class="eyebrow">04 · Functional dependencies &amp; normalization</span>
          <h1 style="margin-top:8px">From the flat notebook to <span class="grad">Third Normal Form.</span></h1>
          <p class="lead" style="margin-top:6px">
            The lab's natural record is one flat “notebook row” per metric measurement.
            Step through the decomposition — <span class="red">red cells</span> are stored redundancy.
          </p>
        </div>

        <div class="reveal" style="margin-top:12px; display:flex; align-items:center; gap:18px; flex-wrap:wrap">
          <div class="nf-steps" id="nf-steps">
            <button data-nf="unf">FLAT</button>
            <button data-nf="nf1">1NF</button>
            <button data-nf="nf2">2NF</button>
            <button data-nf="nf3">3NF</button>
          </div>
          <div class="redcount" id="nf-count"></div>
        </div>

        <div class="nf-stage" id="nf-stage"></div>

        <div class="nf-note reveal">
          <div class="card"><p id="nf-note" style="margin:0;font-size:13.5px"></p></div>
        </div>
      </section>
    </main>

    <footer class="bottombar">
      <a class="navbtn prev" href="#"><span>←</span><span class="label"><small></small><span class="title"></span></span></a>
      <a class="navbtn next" href="#"><span class="label"><small></small><span class="title"></span></span><span>→</span></a>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
